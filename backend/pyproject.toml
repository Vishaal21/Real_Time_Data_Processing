[tool.poetry]
name = "paralell-task-processing"
version = "0.1.0"
description = ""
authors = ["Vishal <singhvishal1821@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.115.0"}
sqlalchemy = "^2.0.35"
python-dotenv = "^1.0.1"
uvicorn = "^0.31.0"
python-multipart = "^0.0.12"
psycopg2 = "^2.9.9"
asyncpg = "^0.29.0"
alembic = "^1.13.3"
celery = "^5.4.0"
pika = "^1.3.2"
aio-pika = "^9.4.3"
black = "^25.1.0"
flake8 = "^7.1.1"
isort = "^6.0.0"
mypy = "^1.14.1"
pre-commit = "^4.1.0"
aiofiles = "^24.1.0"
autoflake = "^2.3.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
run = "uvicorn app.main:app --reload"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | node_modules
  | static
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["app", "tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
show_error_codes = true